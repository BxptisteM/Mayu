services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mayu-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - mayu

  postgres:
    image: postgres:17-alpine
    container_name: mayu-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - mayu

    ports:
      - "127.0.0.1:5432:5432"

networks:
  mayu:
    driver: bridge

volumes:
  postgres_data:
  node_modules:
