name: Mayu CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mayu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck tests
        run: npx tsc -p tests/tsconfig.json --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Check migrations
        env:
          DATABASE_URL: postgresql://mayu:mayu@localhost:5432/mayu
        run: npm run db:check

  build:
    name: Build production images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/bxptistem/mayu:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/BxptisteM/Mayu
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/bxptistem/mayu:sha-${{ github.sha }}-migrations

  deploy:
    name: Deploy to VPS
    needs:
      - validate
      - build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:mayu-ci

      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.MAYU_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MAYU_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mayu_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mayu_deploy ~/.ssh/known_hosts

      - name: Deploy release
        env:
          VPS_HOST: ${{ vars.MAYU_VPS_HOST }}
          RELEASE_TAG: sha-${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/mayu_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            mayu-deploy@"$VPS_HOST" \
            "$RELEASE_TAG"
